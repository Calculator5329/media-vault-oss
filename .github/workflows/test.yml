name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Command-line tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick tesseract-ocr tesseract-ocr-eng
      - name: Python packages
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python vault.py test
